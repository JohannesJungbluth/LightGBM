version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      ci-dependencies:
        patterns:
          - "*"
    cooldown:
      # only accept releases that have been out for at least 15 days
      default-days: 15
    commit-message:
      prefix: "[ci]"
    labels:
      - maintenance
  - package-ecosystem: gitsubmodule
    directory: /
    allow:
      - dependency-name: external_libs/fmt
      - dependency-name: external_libs/fast_double_parser
    schedule:
      interval: monthly
    cooldown:
      # only accept releases that have been out for at least 15 days
      default-days: 15
    commit-message:
      prefix: "[ci]"
    labels:
      - maintenance
